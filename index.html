<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WALL-E räumt die Erde auf – Kunststoff-Mission</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Nunito:wght@400;600;700;800&display=swap');

  :root {
    --rust: #c94a2c;
    --sand: #e8c87a;
    --sky: #7ecfea;
    --dark: #1a1206;
    --panel: #2a2010;
    --green: #5cb85c;
    --amber: #f0a500;
    --red: #e03030;
    --dim: #4a3c20;
    --glow: rgba(240, 165, 0, 0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: #0d0a05;
    color: #e8d8b0;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 20% 80%, rgba(201,74,44,0.12) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(126,207,234,0.08) 0%, transparent 60%);
  }

  /* ===== STARFIELD ===== */
  #stars {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 25%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 70%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 90%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 65% 10%, rgba(255,255,255,0.5) 0%, transparent 100%);
  }

  #app { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 20px; }

  /* ===== HEADER ===== */
  .game-header {
    text-align: center;
    padding: 30px 20px 20px;
    border-bottom: 2px solid var(--dim);
    margin-bottom: 30px;
  }

  .walle-emoji { font-size: 64px; display: block; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

  .game-title {
    font-family: 'Orbitron', monospace;
    font-size: 2rem;
    font-weight: 900;
    color: var(--sand);
    text-shadow: 0 0 20px rgba(232,200,122,0.5);
    margin: 10px 0 5px;
    letter-spacing: 2px;
  }

  .game-subtitle {
    font-family: 'Share Tech Mono', monospace;
    color: var(--sky);
    font-size: 0.9rem;
    letter-spacing: 3px;
  }

  /* ===== NIVEAU SELECTOR ===== */
  .niveau-bar {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 25px;
    flex-wrap: wrap;
  }

  .niveau-btn {
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    padding: 8px 20px;
    border: 2px solid var(--dim);
    background: var(--panel);
    color: #a08050;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
  }
  .niveau-btn:hover { border-color: var(--sand); color: var(--sand); }
  .niveau-btn.active { border-color: var(--amber); color: var(--amber); background: rgba(240,165,0,0.1); box-shadow: 0 0 12px var(--glow); }

  /* ===== PROGRESS BAR ===== */
  .progress-section {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 25px;
    padding: 12px 18px;
    background: var(--panel);
    border: 1px solid var(--dim);
    border-radius: 8px;
  }

  .stage-dots { display: flex; gap: 8px; }
  .stage-dot {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 2px solid var(--dim);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    color: #666;
    transition: all 0.3s;
  }
  .stage-dot.done { border-color: var(--green); color: var(--green); background: rgba(92,184,92,0.1); }
  .stage-dot.active { border-color: var(--amber); color: var(--amber); background: rgba(240,165,0,0.15); animation: pulse-dot 1.5s infinite; }
  @keyframes pulse-dot { 0%,100%{box-shadow:0 0 0 rgba(240,165,0,0.4)} 50%{box-shadow:0 0 10px rgba(240,165,0,0.6)} }

  .progress-label { font-family: 'Share Tech Mono', monospace; font-size: 0.8rem; color: #888; flex:1; }
  .score-display { font-family: 'Orbitron', monospace; font-size: 0.9rem; color: var(--sand); }

  /* ===== STORY BOX ===== */
  .story-box {
    background: linear-gradient(135deg, #1e1508, #0f0d05);
    border: 2px solid var(--dim);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 22px;
    position: relative;
    overflow: hidden;
  }
  .story-box::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--rust), var(--amber), var(--sky));
  }
  .story-tag {
    font-family: 'Orbitron', monospace;
    font-size: 0.65rem;
    color: var(--sky);
    letter-spacing: 3px;
    margin-bottom: 8px;
  }
  .story-text { font-size: 0.95rem; line-height: 1.7; color: #d0c090; }
  .walle-face { font-size: 2.5rem; float: right; margin-left: 15px; }

  /* ===== TASK CARD ===== */
  .task-card {
    background: var(--panel);
    border: 1px solid var(--dim);
    border-radius: 10px;
    padding: 22px;
    margin-bottom: 20px;
  }

  .task-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--dim);
  }
  .task-num {
    width: 36px; height: 36px;
    background: var(--rust);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', monospace;
    font-weight: 700;
    font-size: 0.8rem;
  }
  .task-title { font-weight: 800; font-size: 1rem; color: var(--sand); }
  .task-hint { font-size: 0.8rem; color: #888; margin-left: auto; font-style: italic; }

  .task-body { font-size: 0.92rem; line-height: 1.6; color: #c8b880; margin-bottom: 14px; }

  /* ===== MATCHING / DRAG ===== */
  .match-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 14px 0;
  }

  .match-col-header {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    color: var(--sky);
    letter-spacing: 2px;
    padding: 6px 0;
    border-bottom: 1px solid var(--dim);
    margin-bottom: 6px;
  }

  .match-item {
    background: #1a140a;
    border: 2px solid transparent;
    border-radius: 6px;
    padding: 10px 14px;
    margin: 4px 0;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
    user-select: none;
  }
  .match-item:hover { border-color: var(--amber); background: rgba(240,165,0,0.05); }
  .match-item.selected { border-color: var(--sky); background: rgba(126,207,234,0.1); }
  .match-item.matched-correct { border-color: var(--green); background: rgba(92,184,92,0.1); color: var(--green); }
  .match-item.matched-wrong { border-color: var(--red); background: rgba(224,48,48,0.1); animation: shake 0.3s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

  /* ===== SORT BINS ===== */
  .sort-area {
    margin: 14px 0;
  }
  .sort-items {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
    min-height: 50px;
    padding: 10px;
    background: #0f0c06;
    border: 2px dashed var(--dim);
    border-radius: 8px;
  }
  .sort-chip {
    background: var(--rust);
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.83rem;
    font-weight: 700;
    cursor: grab;
    user-select: none;
    transition: all 0.2s;
    border: 2px solid transparent;
  }
  .sort-chip:active { cursor: grabbing; transform: scale(1.05); }
  .sort-chip.dragging { opacity: 0.5; }

  .bins-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .bin {
    background: #1a140a;
    border: 2px dashed var(--dim);
    border-radius: 10px;
    padding: 14px;
    min-height: 90px;
    transition: all 0.2s;
  }
  .bin.drag-over { border-color: var(--amber); background: rgba(240,165,0,0.07); }
  .bin-label {
    font-family: 'Orbitron', monospace;
    font-size: 0.65rem;
    color: var(--amber);
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .bin-icon { font-size: 1.6rem; margin-bottom: 4px; }
  .bin .sort-chip { margin: 3px; cursor: pointer; font-size: 0.75rem; }

  /* ===== TABLE TASK ===== */
  .prop-table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 0.82rem;
  }
  .prop-table th {
    background: var(--dim);
    color: var(--sky);
    font-family: 'Share Tech Mono', monospace;
    padding: 8px 12px;
    text-align: left;
    letter-spacing: 1px;
    font-size: 0.75rem;
  }
  .prop-table td {
    padding: 8px 12px;
    border-bottom: 1px solid #2a2010;
    color: #c8b880;
  }
  .prop-table tr:hover td { background: rgba(240,165,0,0.03); }
  .prop-table .highlight { color: var(--sand); font-weight: 700; }

  /* ===== RADIO / CHECKBOX ===== */
  .options-list { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
  .option-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: #1a140a;
    border: 2px solid var(--dim);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.88rem;
  }
  .option-item:hover { border-color: #5a4a30; }
  .option-item.selected { border-color: var(--amber); background: rgba(240,165,0,0.08); }
  .option-item.correct { border-color: var(--green); background: rgba(92,184,92,0.1); }
  .option-item.wrong { border-color: var(--red); background: rgba(224,48,48,0.08); }
  .option-radio {
    width: 20px; height: 20px;
    border: 2px solid var(--dim);
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .option-item.selected .option-radio { border-color: var(--amber); background: var(--amber); }
  .option-item.correct .option-radio { border-color: var(--green); background: var(--green); }
  .option-radio::after { content: ''; width: 8px; height: 8px; background: var(--dark); border-radius: 50%; display: none; }
  .option-item.selected .option-radio::after,
  .option-item.correct .option-radio::after { display: block; }

  /* ===== NUMBER INPUT ===== */
  .num-input-group {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px 0;
    flex-wrap: wrap;
  }
  .num-input-label { font-size: 0.88rem; color: #c8b880; }
  .num-input {
    background: #0f0c06;
    border: 2px solid var(--dim);
    border-radius: 6px;
    color: var(--sand);
    font-family: 'Share Tech Mono', monospace;
    font-size: 1rem;
    padding: 6px 12px;
    width: 80px;
    text-align: center;
    transition: border-color 0.2s;
  }
  .num-input:focus { outline: none; border-color: var(--amber); }
  .num-input.correct { border-color: var(--green); color: var(--green); }
  .num-input.wrong { border-color: var(--red); color: var(--red); }

  /* ===== CODE CHECK ===== */
  .code-section {
    background: linear-gradient(135deg, #0a0f08, #0a1205);
    border: 2px solid var(--dim);
    border-radius: 12px;
    padding: 24px;
    margin-top: 24px;
  }
  .code-header {
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    color: var(--green);
    letter-spacing: 4px;
    margin-bottom: 16px;
  }
  .code-display {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  .code-digit {
    width: 42px; height: 50px;
    background: #070c05;
    border: 2px solid var(--dim);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.4rem;
    color: var(--green);
    transition: all 0.3s;
  }
  .code-digit.filled { border-color: var(--green); box-shadow: 0 0 8px rgba(92,184,92,0.3); }
  .code-digit.separator { background: none; border: none; color: var(--dim); font-size: 1.2rem; width: 20px; }
  .code-explanation {
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 16px;
    font-style: italic;
  }
  .check-btn {
    font-family: 'Orbitron', monospace;
    font-size: 0.8rem;
    letter-spacing: 2px;
    padding: 12px 28px;
    background: transparent;
    border: 2px solid var(--green);
    color: var(--green);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .check-btn:hover { background: rgba(92,184,92,0.1); box-shadow: 0 0 15px rgba(92,184,92,0.2); }
  .check-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .code-feedback {
    margin-top: 14px;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 0.88rem;
    font-weight: 700;
    display: none;
  }
  .code-feedback.success { background: rgba(92,184,92,0.15); border: 1px solid var(--green); color: var(--green); display: block; }
  .code-feedback.error { background: rgba(224,48,48,0.1); border: 1px solid var(--red); color: var(--red); display: block; }

  /* ===== UNLOCK / TRANSITION ===== */
  .unlock-screen {
    text-align: center;
    padding: 50px 20px;
    display: none;
  }
  .unlock-screen.visible { display: block; }
  .unlock-icon { font-size: 5rem; animation: celebrate 0.5s ease-out; }
  @keyframes celebrate { 0%{transform:scale(0) rotate(-20deg)} 80%{transform:scale(1.1)} 100%{transform:scale(1)} }
  .unlock-title {
    font-family: 'Orbitron', monospace;
    font-size: 1.5rem;
    color: var(--green);
    margin: 20px 0 10px;
    text-shadow: 0 0 20px rgba(92,184,92,0.5);
  }
  .unlock-text { color: #a09060; font-size: 0.95rem; margin-bottom: 25px; line-height: 1.6; }
  .next-btn {
    font-family: 'Orbitron', monospace;
    font-size: 0.8rem;
    letter-spacing: 2px;
    padding: 14px 35px;
    background: var(--amber);
    border: none;
    color: var(--dark);
    border-radius: 6px;
    cursor: pointer;
    font-weight: 700;
    transition: all 0.2s;
  }
  .next-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(240,165,0,0.4); }

  /* ===== FINAL SCREEN ===== */
  .final-screen { text-align: center; padding: 40px 20px; display: none; }
  .final-screen.visible { display: block; }
  .final-icon { font-size: 6rem; }
  .final-title {
    font-family: 'Orbitron', monospace;
    font-size: 1.8rem;
    color: var(--sand);
    margin: 20px 0 10px;
    text-shadow: 0 0 30px rgba(232,200,122,0.6);
  }
  .final-text { color: #a09060; margin-bottom: 25px; line-height: 1.7; font-size: 0.95rem; }
  .certificate {
    background: linear-gradient(135deg, #1e1810, #0f0c07);
    border: 3px solid var(--sand);
    border-radius: 12px;
    padding: 30px;
    display: inline-block;
    margin-bottom: 20px;
    box-shadow: 0 0 40px rgba(232,200,122,0.2);
  }
  .cert-title { font-family: 'Orbitron', monospace; color: var(--sand); font-size: 0.8rem; letter-spacing: 3px; margin-bottom: 8px; }
  .cert-name { font-size: 1.3rem; font-weight: 800; color: #fff; margin-bottom: 5px; }
  .cert-text { font-size: 0.85rem; color: #a09060; }

  /* ===== MISC ===== */
  .info-box {
    background: rgba(126,207,234,0.07);
    border-left: 3px solid var(--sky);
    padding: 10px 14px;
    border-radius: 0 6px 6px 0;
    margin: 12px 0;
    font-size: 0.85rem;
    color: #a0c8d8;
    line-height: 1.6;
  }
  .info-box strong { color: var(--sky); }

  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 1px;
    font-family: 'Share Tech Mono', monospace;
  }
  .badge-a { background: rgba(92,184,92,0.2); color: var(--green); border: 1px solid var(--green); }
  .badge-b { background: rgba(240,165,0,0.2); color: var(--amber); border: 1px solid var(--amber); }
  .badge-c { background: rgba(201,74,44,0.2); color: #e88060; border: 1px solid var(--rust); }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--dim), transparent);
    margin: 20px 0;
  }

  /* ===== RESPONSIVE ===== */
  @media(max-width: 600px) {
    .game-title { font-size: 1.3rem; }
    .bins-row { grid-template-columns: 1fr; }
    .match-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="stars"></div>
<div id="app">

  <!-- HEADER -->
  <div class="game-header">
    <span class="walle-emoji">🤖</span>
    <div class="game-title">WALL-E räumt die Erde auf</div>
    <div class="game-subtitle">KUNSTSTOFF-MISSION // NATURWISSENSCHAFTEN</div>
  </div>

  <!-- PROGRESS (hidden until game starts) -->
  <div class="progress-section" id="progress-section" style="display:none;">
    <div class="stage-dots">
      <div class="stage-dot active" id="dot1">S1</div>
      <div class="stage-dot" id="dot2">S2</div>
      <div class="stage-dot" id="dot3">S3</div>
    </div>
    <div class="progress-label">Stage <span id="stage-label">1</span>/3 — <span id="stage-name">Sammeln</span></div>
    <div style="font-family:'Orbitron',monospace;font-size:0.75rem;color:var(--amber);" id="niveau-display"></div>
  </div>

  <!-- MAIN CONTENT -->
  <div id="main-content"></div>

</div>

<script>
// =====================================================================
// STATE
// =====================================================================
let niveau = 'A';
let stage = 1;
let playerName = '';

const CODES = {
  s1: Array.from({length:4}, () => Math.floor(Math.random()*9)+1),
  s2: Array.from({length:4}, () => Math.floor(Math.random()*9)+1),
  s3: Array.from({length:4}, () => Math.floor(Math.random()*9)+1),
};

// =====================================================================
// PERSISTENT STORAGE (localStorage per username)
// =====================================================================
const Store = {
  key(name) { return 'walle_' + name.toLowerCase().replace(/\s+/g,'_'); },
  load(name) {
    try { const r = localStorage.getItem(this.key(name)); return r ? JSON.parse(r) : null; }
    catch(e) { return null; }
  },
  save(name, data) {
    try { localStorage.setItem(this.key(name), JSON.stringify(data)); } catch(e) {}
  },
  initUser(name) {
    const ex = this.load(name);
    if(ex) return ex;
    const d = { name, playCount:0, sessions:[] };
    this.save(name, d); return d;
  },
  startSession(name) {
    const d = this.initUser(name);
    d.playCount = (d.playCount||0) + 1;
    d.currentSession = { startedAt:Date.now(), niveau, events:[] };
    this.save(name, d); return d;
  },
  updateSession(name, events) {
    const d = this.load(name); if(!d) return;
    if(d.currentSession) d.currentSession.events = events;
    this.save(name, d);
  },
  finishSession(name, summary) {
    const d = this.load(name); if(!d) return;
    if(d.currentSession) {
      d.currentSession.finishedAt = Date.now();
      d.currentSession.summary = summary;
      d.sessions = d.sessions || [];
      d.sessions.push(d.currentSession);
      if(d.sessions.length > 20) d.sessions = d.sessions.slice(-20);
      delete d.currentSession;
    }
    this.save(name, d);
  },
  getPlayCount(name) { const d = this.load(name); return d ? (d.playCount||1) : 1; },
  getHistory(name)   { const d = this.load(name); return d ? (d.sessions||[]) : []; }
};

let userData = null;
function saveProgress() { if(playerName) Store.updateSession(playerName, tracker.events); }

// =====================================================================
// TRACKER
// =====================================================================
const tracker = {
  events: [],
  log(category, question, given, correct, stageNum) {
    const sn = stageNum !== undefined ? stageNum : stage;
    const isCorrect = String(given) === String(correct);
    this.events = this.events.filter(e => e.question !== question);
    this.events.push({ stage: sn, category, question, given: String(given), correct: String(correct), isCorrect });
  },
  logSort(chipId, binGiven, binCorrect, stageNum) {
    const sn = stageNum !== undefined ? stageNum : stage;
    const isCorrect = binGiven === binCorrect;
    this.events = this.events.filter(e => e.question !== 'sort-'+chipId);
    this.events.push({ stage: sn, category:'sort', question:'sort-'+chipId, given:binGiven, correct:binCorrect, isCorrect });
  },
  summary() {
    const byStage = [1,2,3].map(s => {
      const evs = this.events.filter(e => Number(e.stage) === s);
      const correct = evs.filter(e => e.isCorrect).length;
      return { s, total: evs.length, correct };
    });
    return { byStage, wrongItems: this.events.filter(e => !e.isCorrect) };
  },
  computeScore() {
    // 1.1 Sort: 3 pts proportional
    const sortEvs = this.events.filter(e => e.category==='sort' && Number(e.stage)===1);
    const sortPts = sortEvs.length > 0 ? Math.round(sortEvs.filter(e=>e.isCorrect).length / sortEvs.length * 3) : 0;
    // 1.2, 1.3: 1pt each (for niveau A MC; for B drag-match; for C choice)
    const q12 = this.events.find(e => ['S1-MC-12','S1-B-match-pet','S1-C-Expl-a'].includes(e.question));
    const q13 = this.events.find(e => ['S1-MC-13','S1-B-match-ps','S1-C-Tabelle-Leitf'].includes(e.question));
    // broader: 1pt per correct event in 1.2/1.3 group, max 1 each
    const mc12Events = this.events.filter(e => Number(e.stage)===1 && ['S1-MC-12'].includes(e.question));
    const mc13Events = this.events.filter(e => Number(e.stage)===1 && ['S1-MC-13'].includes(e.question));
    const matchB12 = this.events.filter(e => e.question && e.question.startsWith('S1-B-match-'));
    const matchB13 = this.events.filter(e => e.question && e.question.startsWith('S1-B-struct-'));
    const cExplA = this.events.find(e => e.question==='S1-C-Expl-a');
    const cExplB = this.events.find(e => e.question==='S1-C-Expl-b');

    let pts12 = 0, pts13 = 0;
    if(niveau==='A') {
      pts12 = mc12Events.some(e=>e.isCorrect) ? 1 : 0;
      pts13 = mc13Events.some(e=>e.isCorrect) ? 1 : 0;
    } else if(niveau==='B') {
      // each correct match = fraction; total 1 pt for 1.2, 1 for 1.3
      const m12 = matchB12.length ? Math.round(matchB12.filter(e=>e.isCorrect).length/matchB12.length) : 0;
      const m13 = matchB13.length ? Math.round(matchB13.filter(e=>e.isCorrect).length/matchB13.length) : 0;
      pts12 = m12; pts13 = m13;
    } else {
      // C: 1.2 = choice questions (logged as S1-C-choice-a/b), 1.3 = table selects
      const choiceA = this.events.find(e=>e.question==='S1-C-choice-a');
      const choiceB = this.events.find(e=>e.question==='S1-C-choice-b');
      pts12 = ((choiceA?.isCorrect?0.5:0) + (choiceB?.isCorrect?0.5:0));
      const tabEvs = this.events.filter(e=>e.question?.startsWith('S1-C-Tabelle'));
      pts13 = tabEvs.length ? Math.round(tabEvs.filter(e=>e.isCorrect).length/tabEvs.length) : 0;
    }
    // All other events (S2, S3): 1pt each, but skip free-text (category=text → manual)
    const others = this.events.filter(e => !['sort','text'].includes(e.category) && Number(e.stage)>1);
    const otherPts = others.filter(e=>e.isCorrect).length;
    const otherMax = others.length;
    const total = sortPts + pts12 + pts13 + otherPts;
    const max = 3 + 1 + 1 + otherMax;
    return { earned: Math.round(total*10)/10, max: max || 1 };
  }
};

let s1_sortAnswers = {};
let draggedChip = null;

const sortCorrect = {
  PET:'thermo', PS:'thermo', PVC:'thermo', PP:'thermo',
  HDPE:'thermo', LDPE:'thermo', PA:'thermo', PF:'duro', PU:'elasto'
};

function makeChip(chipId, label, inBin) {
  const chip = document.createElement('div');
  chip.className = 'sort-chip';
  if(inBin) chip.style.fontSize = '0.78rem';
  chip.draggable = true;
  chip.dataset.chip = chipId;
  chip.textContent = label;
  chip.addEventListener('dragstart', ev => {
    draggedChip = chipId;
    ev.dataTransfer.setData('text/plain', chipId);
    chip.classList.add('dragging');
  });
  chip.addEventListener('dragend', () => chip.classList.remove('dragging'));
  if(inBin) {
    chip.title = 'Klicken zum Zurücklegen';
    chip.addEventListener('click', () => {
      delete s1_sortAnswers[chipId];
      chip.remove();
      const pool = document.getElementById('sort-pool');
      if(pool) pool.appendChild(makeChip(chipId, label, false));
      logAllSorts();
    });
  }
  return chip;
}
function chipDrag(e, id) { draggedChip = id; e.dataTransfer && e.dataTransfer.setData('text/plain', id); }
function poolDragOver(e) { e.preventDefault(); }
function poolDrop(e) {
  e.preventDefault();
  const chipId = (e.dataTransfer && e.dataTransfer.getData('text/plain')) || draggedChip;
  if(!chipId) return;
  const el = document.querySelector(`[data-chip="${chipId}"]`);
  if(el && el.closest('#sort-pool')) return;
  const label = el ? el.textContent : chipId;
  if(el) { delete s1_sortAnswers[chipId]; el.remove(); }
  const pool = document.getElementById('sort-pool');
  if(pool) pool.appendChild(makeChip(chipId, label, false));
  draggedChip = null; logAllSorts();
}
function chipDrop(e, binName) {
  e.preventDefault();
  const bin = document.getElementById('bin-'+binName);
  bin.classList.remove('drag-over');
  const chipId = (e.dataTransfer && e.dataTransfer.getData('text/plain')) || draggedChip;
  if(!chipId) return;
  const el = document.querySelector(`[data-chip="${chipId}"]`);
  const label = el ? el.textContent : chipId;
  if(el) { delete s1_sortAnswers[chipId]; el.remove(); }
  s1_sortAnswers[chipId] = binName;
  bin.appendChild(makeChip(chipId, label, true));
  draggedChip = null; logAllSorts();
}
function logAllSorts() {
  Object.keys(sortCorrect).forEach(k => {
    if(s1_sortAnswers[k]) tracker.logSort(k, s1_sortAnswers[k], sortCorrect[k], 1);
  });
}

// =====================================================================
// matchDragState: which left-item is being dragged
let matchDragState = {};
// assignments: leftId -> rightId
let matchAssignments = {};

function buildDragMatchB() {
  // Left items (kunststoffe) fixed order
  const leftItems = [
    {id:'pet', label:'PET'},
    {id:'ps',  label:'PS (Polystyrol)'},
    {id:'pvc', label:'PVC (Polyvinylchlorid)'},
    {id:'hdpe',label:'HDPE (Polyethen, hohe Dichte)'},
    {id:'pp',  label:'PP (Polypropylen)'},
  ];
  // Right items (Verwendung) — shuffled each time
  const rightItems = shuffle([
    {id:'pet_r', label:'Folien, Lebensmittelflaschen, PET-Flaschen'},
    {id:'ps_r',  label:'Styropor-Verpackungen, Dämmstoffe'},
    {id:'pvc_r', label:'Fensterrahmen, Rohre, Bodenbeläge'},
    {id:'hdpe_r',label:'Reinigungsmittelbehälter, Plastikflaschen'},
    {id:'pp_r',  label:'Kindersitze, Stoßstangen, Lebensmittelverp.'},
  ]);

  let html = `<div style="margin:12px 0;">
    <div class="info-box" style="margin-bottom:12px;">Ziehe einen Kunststoff auf die passende Verwendung. Klicke eine Verbindung um sie zu lösen.</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div>
        <div class="match-col-header">KUNSTSTOFF</div>`;
  leftItems.forEach(it => {
    html += `<div class="match-item drag-source" id="bm-${it.id}" draggable="true"
      ondragstart="matchDragStart(event,'${it.id}')"
      style="cursor:grab;position:relative;">
      ${it.label}
      <span id="bm-${it.id}-tag" style="display:none;position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:0.7rem;background:var(--amber);color:#000;border-radius:10px;padding:1px 7px;"></span>
    </div>`;
  });
  html += `</div><div>
        <div class="match-col-header">VERWENDUNG</div>`;
  rightItems.forEach(it => {
    html += `<div class="match-item drag-target" id="bm-${it.id}"
      ondragover="event.preventDefault();this.classList.add('selected')"
      ondragleave="this.classList.remove('selected')"
      ondrop="matchDrop(event,'${it.id}')"
      onclick="matchDetach('${it.id}')">
      ${it.label}
    </div>`;
  });
  html += `</div></div></div>`;
  return html;
}

function matchDragStart(e, leftId) {
  matchDragState.leftId = leftId;
  e.dataTransfer.setData('text/plain', leftId);
}

const matchBPairsCorrect = {pet:'pet_r', ps:'ps_r', pvc:'pvc_r', hdpe:'hdpe_r', pp:'pp_r'};

function matchDrop(e, rightId) {
  e.preventDefault();
  const target = e.target.closest('.drag-target');
  if(target) target.classList.remove('selected');
  const leftId = matchDragState.leftId || e.dataTransfer.getData('text/plain');
  if(!leftId) return;
  // Remove previous assignment for this leftId
  const prev = matchAssignments[leftId];
  if(prev) {
    const prevTarget = document.getElementById('bm-'+prev);
    if(prevTarget) { prevTarget.style.borderColor=''; prevTarget.style.background=''; prevTarget.dataset.assignedBy=''; }
  }
  // Remove any existing assignment to this rightId
  Object.entries(matchAssignments).forEach(([lId, rId]) => {
    if(rId === rightId && lId !== leftId) {
      const ltag = document.getElementById('bm-'+lId+'-tag');
      if(ltag) { ltag.style.display='none'; ltag.textContent=''; }
      const prevT = document.getElementById('bm-'+rId);
      if(prevT) { prevT.style.borderColor=''; prevT.style.background=''; }
      delete matchAssignments[lId];
    }
  });
  matchAssignments[leftId] = rightId;
  const isCorrect = matchBPairsCorrect[leftId] === rightId;
  tracker.log('match','S1-B-match-'+leftId, leftId+'->'+rightId, leftId+'->'+matchBPairsCorrect[leftId], 1);
  // Visual: show abbreviated label on left item
  const tag = document.getElementById('bm-'+leftId+'-tag');
  if(tag) { tag.style.display='inline'; tag.textContent='→'; }
  const leftEl = document.getElementById('bm-'+leftId);
  if(leftEl) { leftEl.style.borderColor='var(--amber)'; leftEl.style.background='rgba(240,165,0,0.08)'; }
  const rightEl = document.getElementById('bm-'+rightId);
  if(rightEl) { rightEl.style.borderColor='var(--amber)'; rightEl.style.background='rgba(240,165,0,0.08)'; rightEl.dataset.assignedBy=leftId; }
  matchDragState = {};
}

function matchDetach(rightId) {
  // Find which leftId is assigned to this rightId and detach
  const leftId = Object.entries(matchAssignments).find(([,r]) => r===rightId)?.[0];
  if(!leftId) return;
  const tag = document.getElementById('bm-'+leftId+'-tag');
  if(tag) { tag.style.display='none'; tag.textContent=''; }
  const leftEl = document.getElementById('bm-'+leftId);
  if(leftEl) { leftEl.style.borderColor=''; leftEl.style.background=''; }
  const rightEl = document.getElementById('bm-'+rightId);
  if(rightEl) { rightEl.style.borderColor=''; rightEl.style.background=''; rightEl.dataset.assignedBy=''; }
  delete matchAssignments[leftId];
  // Log detach as no answer
  tracker.log('match','S1-B-match-'+leftId, 'detached', leftId+'->'+matchBPairsCorrect[leftId], 1);
}

function shuffle(arr) {
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

let matchCDragState = {};
let matchCAssignments = {};
const matchCPairsCorrect = {tp:'tp_r', dp:'dp_r', el:'el_r'};

function buildDragMatchC3() {
  const leftItems = [
    {id:'tp', label:'Thermoplast'},
    {id:'dp', label:'Duroplast'},
    {id:'el', label:'Elastomer'},
  ];
  const rightItems = shuffle([
    {id:'tp_r', label:'Lange, unverzweigte Ketten; Van-der-Waals-Kräfte halten sie zusammen – beim Erwärmen gleiten die Ketten aneinander vorbei'},
    {id:'dp_r', label:'Engmaschiges, räumliches Netz aus Elektronenpaarbindungen – bleibt auch bei Erwärmen stabil'},
    {id:'el_r', label:'Wenige Verknüpfungspunkte zwischen langen Ketten – Ketten können bei Belastung vorbeigleiten und kehren zurück'},
  ]);
  let html = `<div style="margin:12px 0;">
    <div class="info-box" style="margin-bottom:12px;">Ziehe die Kunststoffgruppe auf das passende Strukturmerkmal. Klicke eine Verwendung um die Verbindung zu lösen.</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div><div class="match-col-header">KUNSTSTOFFGRUPPE</div>`;
  leftItems.forEach(it => {
    html += `<div class="match-item drag-source" id="cm-${it.id}" draggable="true"
      ondragstart="matchCDragStart(event,'${it.id}')"
      style="cursor:grab;position:relative;min-height:44px;">
      ${it.label}
      <span id="cm-${it.id}-tag" style="display:none;position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:0.7rem;background:var(--amber);color:#000;border-radius:10px;padding:1px 7px;">→</span>
    </div>`;
  });
  html += `</div><div><div class="match-col-header">STRUKTURMERKMAL</div>`;
  rightItems.forEach(it => {
    html += `<div class="match-item drag-target" id="cm-${it.id}" style="min-height:60px;font-size:0.82rem;"
      ondragover="event.preventDefault();this.classList.add('selected')"
      ondragleave="this.classList.remove('selected')"
      ondrop="matchCDrop(event,'${it.id}')"
      onclick="matchCDetach('${it.id}')">
      ${it.label}
    </div>`;
  });
  html += `</div></div></div>`;
  return html;
}

function matchCDragStart(e, leftId) {
  matchCDragState.leftId = leftId;
  e.dataTransfer.setData('text/plain', leftId);
}
function matchCDrop(e, rightId) {
  e.preventDefault();
  const target = e.target.closest('.drag-target');
  if(target) target.classList.remove('selected');
  const leftId = matchCDragState.leftId || e.dataTransfer.getData('text/plain');
  if(!leftId) return;
  const prev = matchCAssignments[leftId];
  if(prev) {
    const prevEl = document.getElementById('cm-'+prev);
    if(prevEl) { prevEl.style.borderColor=''; prevEl.style.background=''; }
  }
  Object.entries(matchCAssignments).forEach(([lId, rId]) => {
    if(rId===rightId && lId!==leftId) {
      const t = document.getElementById('cm-'+lId+'-tag');
      if(t) { t.style.display='none'; }
      const p = document.getElementById('cm-'+rId);
      if(p) { p.style.borderColor=''; p.style.background=''; }
      delete matchCAssignments[lId];
    }
  });
  matchCAssignments[leftId] = rightId;
  tracker.log('match','S3-C-struct-'+leftId, leftId+'->'+rightId, leftId+'->'+matchCPairsCorrect[leftId], 3);
  const tag = document.getElementById('cm-'+leftId+'-tag');
  if(tag) tag.style.display='inline';
  const leftEl = document.getElementById('cm-'+leftId);
  if(leftEl) { leftEl.style.borderColor='var(--amber)'; leftEl.style.background='rgba(240,165,0,0.08)'; }
  const rightEl = document.getElementById('cm-'+rightId);
  if(rightEl) { rightEl.style.borderColor='var(--amber)'; rightEl.style.background='rgba(240,165,0,0.08)'; }
  matchCDragState = {};
}
function matchCDetach(rightId) {
  const leftId = Object.entries(matchCAssignments).find(([,r])=>r===rightId)?.[0];
  if(!leftId) return;
  const tag = document.getElementById('cm-'+leftId+'-tag');
  if(tag) tag.style.display='none';
  const leftEl = document.getElementById('cm-'+leftId);
  if(leftEl) { leftEl.style.borderColor=''; leftEl.style.background=''; }
  const rightEl = document.getElementById('cm-'+rightId);
  if(rightEl) { rightEl.style.borderColor=''; rightEl.style.background=''; }
  delete matchCAssignments[leftId];
  tracker.log('match','S3-C-struct-'+leftId,'detached',leftId+'->'+matchCPairsCorrect[leftId],3);
}

// Stage 3 bio sort
let draggedChip2 = null;
function chipDrag2(e, id) { draggedChip2 = id; e.dataTransfer && e.dataTransfer.setData('text/plain', id); }
function chipDrop2(e, binName) {
  e.preventDefault();
  const bin = document.getElementById('bin2-'+binName);
  bin.classList.remove('drag-over');
  const chipId = (e.dataTransfer && e.dataTransfer.getData('text/plain')) || draggedChip2;
  if(!chipId) return;
  const existing = document.querySelector(`[data-chip="${chipId}"]`);
  const label = existing ? existing.textContent : chipId;
  if(existing) { delete s3_sort2[chipId]; existing.remove(); }
  s3_sort2[chipId] = binName;
  const bioCorrect = {PLA:'a', PET2:'d', PBAT:'b', PS2:'d'};
  tracker.log('sort','S3-Bio-'+chipId, binName, bioCorrect[chipId]||'?', 3);
  const chip = document.createElement('div');
  chip.className='sort-chip'; chip.style.fontSize='0.75rem';
  chip.draggable=true; chip.dataset.chip=chipId; chip.textContent=label;
  chip.addEventListener('dragstart', ev=>{ draggedChip2=chipId; ev.dataTransfer.setData('text/plain',chipId); });
  chip.addEventListener('click', ()=>{ delete s3_sort2[chipId]; chip.remove(); });
  bin.appendChild(chip);
  draggedChip2=null;
}

function showFinal() {
  const allCodes = `${CODES.s1.join('-')} – ${CODES.s2.join('-')} – ${CODES.s3.join('-')}`;
  const sum = tracker.summary();
  const sc = tracker.computeScore();
  const pct = Math.round(sc.earned / sc.max * 100);
  const stars = pct>=90?5:pct>=75?4:pct>=60?3:pct>=40?2:1;
  const starStr = '★'.repeat(stars)+'☆'.repeat(5-stars);
  const stageNames = ['Sammeln & Sortieren','Eigenschaften analysieren','Recycling & Struktur'];
  const feedbackMsg = pct>=90?'WALL-E ist begeistert! 🎉 Hervorragende Leistung!'
    :pct>=70?'Gut gemacht! Ein paar Themen nochmal nachschlagen.'
    :pct>=50?'Grundlagen vorhanden – lies S. 350–353 nochmal durch!'
    :'Schau dir die Tabellen im Buch nochmal an.';

  const playCount = Store.getPlayCount(playerName);
  const sessionSummary = { pct, score:sc.earned, maxScore:sc.max, niveau, allCodes, feedbackMsg };
  Store.finishSession(playerName, sessionSummary);

  const history = Store.getHistory(playerName);
  const bestPct = history.length > 0 ? Math.max(...history.map(s => s.summary?.pct || 0)) : pct;

  const stageRows = sum.byStage.map(s => {
    const p = s.total>0?Math.round(s.correct/s.total*100):0;
    const col = p>=80?'var(--green)':p>=50?'var(--amber)':'var(--red)';
    return `<tr>
      <td style="padding:8px 12px;color:#a09060;">Stage ${s.s} – ${stageNames[s.s-1]}</td>
      <td style="padding:8px 12px;text-align:center;font-weight:700;">${s.correct}/${s.total}</td>
      <td style="padding:8px 12px;text-align:center;color:${col};font-weight:700;">${s.total>0?p+'%':'—'}</td>
      <td style="padding:8px 12px;width:120px;"><div style="background:#1a140a;border-radius:4px;height:8px;overflow:hidden;">
        <div style="width:${p}%;height:100%;background:${col};border-radius:4px;"></div></div></td></tr>`;
  }).join('');

  const seen = new Set();
  const wrongRows = sum.wrongItems.filter(e=>{if(seen.has(e.question))return false;seen.add(e.question);return true;})
    .map(e=>{
      const lbl={thermo:'Thermoplaste',duro:'Duroplaste',elasto:'Elastomere','—':'(nicht beantwortet)','detached':'(nicht zugeordnet)','true':'richtig (✓)','false':'falsch (✗)',"true":'richtig (✓)',"false":'falsch (✗)'};
      const tv = v => { const t=lbl[v]; if(t) return t; return v.replace(/"true"/g,'"richtig"').replace(/"false"/g,'"falsch"').replace(/:true/g,':richtig').replace(/:false/g,':falsch'); };
      return `<tr>
        <td style="padding:6px 10px;font-family:'Share Tech Mono',monospace;font-size:0.78rem;color:#e8d8b0;">${e.question}</td>
        <td style="padding:6px 10px;font-size:0.82rem;color:var(--red);">${tv(e.given)}</td>
        <td style="padding:6px 10px;font-size:0.82rem;color:var(--green);">${tv(e.correct)}</td></tr>`;
    }).join('');

  window._finalData = { allCodes, pct, starStr, score:sc.earned, maxScore:sc.max, niveau, feedbackMsg, playerName, playCount, bestPct };
  for(let i=1;i<=3;i++) document.getElementById('dot'+i).className='stage-dot done';

  const playLabel = playCount === 1 ? '1. Versuch' : `${playCount}. Versuch`;
  const newBest = pct >= bestPct ? ' 🏅 Neuer Rekord!' : '';

  document.getElementById('main-content').innerHTML = `
    <div class="final-screen visible">
      <div class="final-icon">🌍✨</div>
      <div class="final-title">MISSION ACCOMPLISHED!</div>
      <div class="final-text"><em>"Eeeeva!"</em> – WALL-E freut sich!<br>${feedbackMsg}</div>
      <div class="certificate" style="margin-bottom:24px;">
        <div class="cert-title">⬡ WALL-E RECYCLING-ZERTIFIKAT // NIVEAU ${niveau}</div>
        <div style="font-size:1.8rem;margin:8px 0;color:var(--amber);">${starStr}</div>
        <div class="cert-name">${playerName}</div>
        <div class="cert-text">${pct}% · ${sc.earned}/${sc.max} Punkte${newBest}<br>
          <span style="color:#888;font-size:0.8rem;">${playLabel} · Bestes Ergebnis: ${bestPct}%</span><br>
          Codes: <span style="font-family:'Share Tech Mono',monospace;color:var(--green);">${allCodes}</span>
        </div>
      </div>
      <div style="background:var(--panel);border:1px solid var(--dim);border-radius:10px;margin-bottom:20px;overflow:hidden;">
        <div style="padding:12px 16px;border-bottom:1px solid var(--dim);font-family:'Orbitron',monospace;font-size:0.7rem;color:var(--sky);letter-spacing:3px;">▶ AUSWERTUNG NACH STAGE</div>
        <table style="width:100%;border-collapse:collapse;">
          <tr style="background:#1a140a;">
            <th style="padding:8px 12px;text-align:left;font-family:'Share Tech Mono',monospace;font-size:0.7rem;color:#888;">BEREICH</th>
            <th style="padding:8px 12px;font-family:'Share Tech Mono',monospace;font-size:0.7rem;color:#888;">RICHTIG</th>
            <th style="padding:8px 12px;font-family:'Share Tech Mono',monospace;font-size:0.7rem;color:#888;">QUOTE</th>
            <th style="padding:8px 12px;font-family:'Share Tech Mono',monospace;font-size:0.7rem;color:#888;">FORTSCHRITT</th>
          </tr>${stageRows}
        </table>
      </div>
      ${wrongRows ? `
      <div style="background:var(--panel);border:1px solid var(--dim);border-radius:10px;margin-bottom:20px;overflow:hidden;">
        <div style="padding:12px 16px;border-bottom:1px solid var(--dim);font-family:'Orbitron',monospace;font-size:0.7rem;color:var(--red);letter-spacing:3px;">▶ NACHSCHLAGEN EMPFOHLEN</div>
        <table style="width:100%;border-collapse:collapse;">
          <tr style="background:#1a140a;">
            <th style="padding:6px 10px;text-align:left;font-family:'Share Tech Mono',monospace;font-size:0.7rem;color:#888;">AUFGABE</th>
            <th style="padding:6px 10px;text-align:left;font-family:'Share Tech Mono',monospace;font-size:0.7rem;color:#888;">ANTWORT</th>
            <th style="padding:6px 10px;text-align:left;font-family:'Share Tech Mono',monospace;font-size:0.7rem;color:#888;">RICHTIG WÄRE</th>
          </tr>${wrongRows}
        </table>
        <div style="padding:10px 16px;font-size:0.82rem;color:#888;border-top:1px solid var(--dim);">💡 S. 347–353 im Buch.</div>
      </div>` : `
      <div style="background:rgba(92,184,92,0.1);border:1px solid var(--green);border-radius:10px;padding:16px;margin-bottom:20px;text-align:center;color:var(--green);font-weight:700;">
        🏆 Keine Fehler – perfekte Leistung!</div>`}
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px;">
        <button class="next-btn" onclick="location.reload()" style="background:var(--dim);color:var(--sand);">🔄 NEU STARTEN</button>
        <button class="next-btn" onclick="exportPdf()" style="background:transparent;border:2px solid var(--sand);color:var(--sand);">📄 ALS PDF SPEICHERN</button>
      </div>
    </div>`;
}

// =====================================================================
// PDF EXPORT
// =====================================================================
function exportPdf() {
  const d = window._finalData;
  const dateStr = new Date().toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
  const printHtml = `<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8">
<title>WALL-E Auswertung – ${d.playerName}</title>
<style>
  body{font-family:Arial,sans-serif;background:#fff;color:#1a1206;padding:20px 30px;font-size:11pt;}
  .header{display:flex;align-items:center;gap:16px;border-bottom:3px solid #c94a2c;padding-bottom:14px;margin-bottom:18px;}
  .h-title{font-size:1.3rem;font-weight:900;color:#c94a2c;}
  .h-sub{font-size:0.85rem;color:#666;letter-spacing:2px;margin-top:3px;}
  .meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px;}
  .meta-box{border:1px solid #ddd;border-radius:6px;padding:10px 14px;}
  .meta-label{font-size:0.72rem;color:#999;letter-spacing:1px;margin-bottom:3px;text-transform:uppercase;}
  .meta-val{font-size:1.1rem;font-weight:800;}
  .section-title{font-size:0.7rem;letter-spacing:3px;color:#555;border-bottom:1px solid #ddd;padding-bottom:6px;margin:16px 0 10px;text-transform:uppercase;}
  table{width:100%;border-collapse:collapse;font-size:10pt;}
  th{background:#f5f5f5;padding:7px 10px;text-align:left;font-size:0.68rem;color:#666;letter-spacing:1px;text-transform:uppercase;}
  td{padding:7px 10px;border-bottom:1px solid #eee;}
  .pct-good{color:#3a8a3a;font-weight:700;} .pct-mid{color:#c07000;font-weight:700;} .pct-bad{color:#c02020;font-weight:700;}
  .bar-wrap{background:#eee;border-radius:3px;height:7px;overflow:hidden;width:100px;}
  .bar-fill{height:100%;border-radius:3px;}
  .code-box{background:#f5f5f5;border:1px solid #ddd;border-radius:6px;padding:12px 16px;font-size:0.9rem;margin-bottom:16px;font-family:monospace;}
  .feedback-box{background:#fff8e8;border-left:4px solid #e8a000;padding:10px 14px;border-radius:0 6px 6px 0;margin-bottom:16px;}
  .no-errors{background:#eafaea;border:1px solid #3a8a3a;border-radius:6px;padding:12px;text-align:center;color:#2a7a2a;font-weight:700;}
  .footer{margin-top:24px;padding-top:12px;border-top:1px solid #ddd;font-size:0.75rem;color:#999;display:flex;justify-content:space-between;}
  @media print{body{padding:10px 15px;} @page{margin:1.5cm;size:A4;}}
</style></head><body>
<div class="header">
  <div style="font-size:2.5rem;">🤖</div>
  <div><div class="h-title">WALL-E räumt die Erde auf</div>
  <div class="h-sub">LERNAUSWERTUNG // KUNSTSTOFFE // KLASSE 9</div></div>
</div>
<div class="meta">
  <div class="meta-box"><div class="meta-label">Name</div><div class="meta-val">${d.playerName}</div></div>
  <div class="meta-box"><div class="meta-label">Datum</div><div class="meta-val">${dateStr}</div></div>
  <div class="meta-box"><div class="meta-label">Niveau</div><div class="meta-val">${d.niveau} &nbsp;${d.starStr}</div></div>
</div>
<div class="meta" style="grid-template-columns:1fr 1fr;">
  <div class="meta-box"><div class="meta-label">Versuch</div><div class="meta-val">${d.playCount}. Durchlauf</div></div>
  <div class="meta-box"><div class="meta-label">Bestes Ergebnis</div><div class="meta-val">${d.bestPct}%</div></div>
</div>
<div class="code-box">Stage-Codes: <strong>${d.allCodes}</strong> &nbsp;·&nbsp; Ergebnis: <strong>${d.pct}%</strong> &nbsp;·&nbsp; Punkte: <strong>${d.score}/${d.maxScore}</strong></div>
<div class="feedback-box">${d.feedbackMsg}</div>
<div class="section-title">▶ Auswertung nach Lernbereich</div>
<table><tr><th>Bereich</th><th>Richtig</th><th>Quote</th><th>Fortschritt</th></tr>
  ${tracker.summary().byStage.map(s=>{
    const p=s.total>0?Math.round(s.correct/s.total*100):0;
    const cls=p>=80?'pct-good':p>=50?'pct-mid':'pct-bad';
    const col=p>=80?'#3a8a3a':p>=50?'#c07000':'#c02020';
    const names=['Sammeln & Sortieren','Eigenschaften analysieren','Recycling & Struktur'];
    return `<tr><td>Stage ${s.s} – ${names[s.s-1]}</td><td>${s.correct}/${s.total}</td>
      <td class="${cls}">${s.total>0?p+'%':'—'}</td>
      <td><div class="bar-wrap"><div class="bar-fill" style="width:${p}%;background:${col};"></div></div></td></tr>`;
  }).join('')}
</table>
${tracker.summary().wrongItems.length>0?`
<div class="section-title">▶ Empfohlene Wiederholung</div>
<table><tr><th>Aufgabe</th><th>Antwort</th><th>Richtig wäre</th></tr>
  ${(()=>{const seen=new Set();return tracker.summary().wrongItems
    .filter(e=>{if(seen.has(e.question))return false;seen.add(e.question);return true;})
    .map(e=>{const lbl={thermo:'Thermoplaste',duro:'Duroplaste',elasto:'Elastomere','—':'(leer)','detached':'(nicht zugeordnet)','true':'richtig (✓)','false':'falsch (✗)'};
      const tv = v => { const t=lbl[v]; if(t) return t; return v.replace(/"true"/g,'"richtig"').replace(/"false"/g,'"falsch"').replace(/:true/g,':richtig').replace(/:false/g,':falsch'); };
      return `<tr><td>${e.question}</td><td style="color:#c02020">${tv(e.given)}</td><td style="color:#2a7a2a">${tv(e.correct)}</td></tr>`;
    }).join('');})()}
</table>
<p style="font-size:9pt;color:#888;margin-top:8px;">💡 S. 347–353 im Buch nachschlagen.</p>`:
`<div class="section-title">▶ Fehlerauswertung</div>
<div class="no-errors">🏆 Keine Fehler – alle Aufgaben korrekt gelöst!</div>`}
<div class="footer">
  <span>WALL-E räumt die Erde auf · Naturwissenschaften Klasse 9</span><span>${dateStr}</span>
</div></body></html>`;

  const blob = new Blob([printHtml], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const win = window.open(url, '_blank');
  if(win) {
    win.onload = () => {
      win.focus();
      win.print();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    };
  } else {
    // Fallback if popup blocked: download as HTML
    const a = document.createElement('a');
    a.href = url;
    a.download = `WALLE_${d.playerName.replace(/\s+/g,'_')}_${dateStr.replace(/\./g,'-')}.html`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
    alert('Hinweis: Bitte erlaube Popups für diese Seite, damit das PDF direkt geöffnet wird.');
  }
}

// =====================================================================
// INIT
// =====================================================================
renderNiveauScreen();
</script></body></html>
