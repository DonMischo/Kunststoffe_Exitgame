<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WALL-E räumt die Erde auf – Kunststoff-Mission</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Nunito:wght@400;600;700;800&display=swap');

  :root {
    --rust: #c94a2c;
    --sand: #e8c87a;
    --sky: #7ecfea;
    --dark: #1a1206;
    --panel: #2a2010;
    --green: #5cb85c;
    --amber: #f0a500;
    --red: #e03030;
    --dim: #4a3c20;
    --glow: rgba(240, 165, 0, 0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: #0d0a05;
    color: #e8d8b0;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 20% 80%, rgba(201,74,44,0.12) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(126,207,234,0.08) 0%, transparent 60%);
  }

  /* ===== STARFIELD ===== */
  #stars {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 25%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 70%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 90%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 65% 10%, rgba(255,255,255,0.5) 0%, transparent 100%);
  }

  #app { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 20px; }

  /* ===== HEADER ===== */
  .game-header {
    text-align: center;
    padding: 30px 20px 20px;
    border-bottom: 2px solid var(--dim);
    margin-bottom: 30px;
  }

  .walle-emoji { font-size: 64px; display: block; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

  .game-title {
    font-family: 'Orbitron', monospace;
    font-size: 2rem;
    font-weight: 900;
    color: var(--sand);
    text-shadow: 0 0 20px rgba(232,200,122,0.5);
    margin: 10px 0 5px;
    letter-spacing: 2px;
  }

  .game-subtitle {
    font-family: 'Share Tech Mono', monospace;
    color: var(--sky);
    font-size: 0.9rem;
    letter-spacing: 3px;
  }

  /* ===== NIVEAU SELECTOR ===== */
  .niveau-bar {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 25px;
    flex-wrap: wrap;
  }

  .niveau-btn {
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    padding: 8px 20px;
    border: 2px solid var(--dim);
    background: var(--panel);
    color: #a08050;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
  }
  .niveau-btn:hover { border-color: var(--sand); color: var(--sand); }
  .niveau-btn.active { border-color: var(--amber); color: var(--amber); background: rgba(240,165,0,0.1); box-shadow: 0 0 12px var(--glow); }

  /* ===== PROGRESS BAR ===== */
  .progress-section {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 25px;
    padding: 12px 18px;
    background: var(--panel);
    border: 1px solid var(--dim);
    border-radius: 8px;
  }

  .stage-dots { display: flex; gap: 8px; }
  .stage-dot {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 2px solid var(--dim);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    color: #666;
    transition: all 0.3s;
  }
  .stage-dot.done { border-color: var(--green); color: var(--green); background: rgba(92,184,92,0.1); }
  .stage-dot.active { border-color: var(--amber); color: var(--amber); background: rgba(240,165,0,0.15); animation: pulse-dot 1.5s infinite; }
  @keyframes pulse-dot { 0%,100%{box-shadow:0 0 0 rgba(240,165,0,0.4)} 50%{box-shadow:0 0 10px rgba(240,165,0,0.6)} }

  .progress-label { font-family: 'Share Tech Mono', monospace; font-size: 0.8rem; color: #888; flex:1; }
  .score-display { font-family: 'Orbitron', monospace; font-size: 0.9rem; color: var(--sand); }

  /* ===== STORY BOX ===== */
  .story-box {
    background: linear-gradient(135deg, #1e1508, #0f0d05);
    border: 2px solid var(--dim);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 22px;
    position: relative;
    overflow: hidden;
  }
  .story-box::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--rust), var(--amber), var(--sky));
  }
  .story-tag {
    font-family: 'Orbitron', monospace;
    font-size: 0.65rem;
    color: var(--sky);
    letter-spacing: 3px;
    margin-bottom: 8px;
  }
  .story-text { font-size: 0.95rem; line-height: 1.7; color: #d0c090; }
  .walle-face { font-size: 2.5rem; float: right; margin-left: 15px; }

  /* ===== TASK CARD ===== */
  .task-card {
    background: var(--panel);
    border: 1px solid var(--dim);
    border-radius: 10px;
    padding: 22px;
    margin-bottom: 20px;
  }

  .task-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--dim);
  }
  .task-num {
    width: 36px; height: 36px;
    background: var(--rust);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', monospace;
    font-weight: 700;
    font-size: 0.8rem;
  }
  .task-title { font-weight: 800; font-size: 1rem; color: var(--sand); }
  .task-hint { font-size: 0.8rem; color: #888; margin-left: auto; font-style: italic; }

  .task-body { font-size: 0.92rem; line-height: 1.6; color: #c8b880; margin-bottom: 14px; }

  /* ===== MATCHING / DRAG ===== */
  .match-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 14px 0;
  }

  .match-col-header {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    color: var(--sky);
    letter-spacing: 2px;
    padding: 6px 0;
    border-bottom: 1px solid var(--dim);
    margin-bottom: 6px;
  }

  .match-item {
    background: #1a140a;
    border: 2px solid transparent;
    border-radius: 6px;
    padding: 10px 14px;
    margin: 4px 0;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
    user-select: none;
  }
  .match-item:hover { border-color: var(--amber); background: rgba(240,165,0,0.05); }
  .match-item.selected { border-color: var(--sky); background: rgba(126,207,234,0.1); }
  .match-item.matched-correct { border-color: var(--green); background: rgba(92,184,92,0.1); color: var(--green); }
  .match-item.matched-wrong { border-color: var(--red); background: rgba(224,48,48,0.1); animation: shake 0.3s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

  /* ===== SORT BINS ===== */
  .sort-area {
    margin: 14px 0;
  }
  .sort-items {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
    min-height: 50px;
    padding: 10px;
    background: #0f0c06;
    border: 2px dashed var(--dim);
    border-radius: 8px;
  }
  .sort-chip {
    background: var(--rust);
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.83rem;
    font-weight: 700;
    cursor: grab;
    user-select: none;
    transition: all 0.2s;
    border: 2px solid transparent;
  }
  .sort-chip:active { cursor: grabbing; transform: scale(1.05); }
  .sort-chip.dragging { opacity: 0.5; }

  .bins-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .bin {
    background: #1a140a;
    border: 2px dashed var(--dim);
    border-radius: 10px;
    padding: 14px;
    min-height: 90px;
    transition: all 0.2s;
  }
  .bin.drag-over { border-color: var(--amber); background: rgba(240,165,0,0.07); }
  .bin-label {
    font-family: 'Orbitron', monospace;
    font-size: 0.65rem;
    color: var(--amber);
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .bin-icon { font-size: 1.6rem; margin-bottom: 4px; }
  .bin .sort-chip { margin: 3px; cursor: pointer; font-size: 0.75rem; }

  /* ===== TABLE TASK ===== */
  .prop-table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 0.82rem;
  }
  .prop-table th {
    background: var(--dim);
    color: var(--sky);
    font-family: 'Share Tech Mono', monospace;
    padding: 8px 12px;
    text-align: left;
    letter-spacing: 1px;
    font-size: 0.75rem;
  }
  .prop-table td {
    padding: 8px 12px;
    border-bottom: 1px solid #2a2010;
    color: #c8b880;
  }
  .prop-table tr:hover td { background: rgba(240,165,0,0.03); }
  .prop-table .highlight { color: var(--sand); font-weight: 700; }

  /* ===== RADIO / CHECKBOX ===== */
  .options-list { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
  .option-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: #1a140a;
    border: 2px solid var(--dim);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.88rem;
  }
  .option-item:hover { border-color: #5a4a30; }
  .option-item.selected { border-color: var(--amber); background: rgba(240,165,0,0.08); }
  .option-item.correct { border-color: var(--green); background: rgba(92,184,92,0.1); }
  .option-item.wrong { border-color: var(--red); background: rgba(224,48,48,0.08); }
  .option-radio {
    width: 20px; height: 20px;
    border: 2px solid var(--dim);
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .option-item.selected .option-radio { border-color: var(--amber); background: var(--amber); }
  .option-item.correct .option-radio { border-color: var(--green); background: var(--green); }
  .option-radio::after { content: ''; width: 8px; height: 8px; background: var(--dark); border-radius: 50%; display: none; }
  .option-item.selected .option-radio::after,
  .option-item.correct .option-radio::after { display: block; }

  /* ===== NUMBER INPUT ===== */
  .num-input-group {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px 0;
    flex-wrap: wrap;
  }
  .num-input-label { font-size: 0.88rem; color: #c8b880; }
  .num-input {
    background: #0f0c06;
    border: 2px solid var(--dim);
    border-radius: 6px;
    color: var(--sand);
    font-family: 'Share Tech Mono', monospace;
    font-size: 1rem;
    padding: 6px 12px;
    width: 80px;
    text-align: center;
    transition: border-color 0.2s;
  }
  .num-input:focus { outline: none; border-color: var(--amber); }
  .num-input.correct { border-color: var(--green); color: var(--green); }
  .num-input.wrong { border-color: var(--red); color: var(--red); }

  /* ===== CODE CHECK ===== */
  .code-section {
    background: linear-gradient(135deg, #0a0f08, #0a1205);
    border: 2px solid var(--dim);
    border-radius: 12px;
    padding: 24px;
    margin-top: 24px;
  }
  .code-header {
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    color: var(--green);
    letter-spacing: 4px;
    margin-bottom: 16px;
  }
  .code-display {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  .code-digit {
    width: 42px; height: 50px;
    background: #070c05;
    border: 2px solid var(--dim);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.4rem;
    color: var(--green);
    transition: all 0.3s;
  }
  .code-digit.filled { border-color: var(--green); box-shadow: 0 0 8px rgba(92,184,92,0.3); }
  .code-digit.separator { background: none; border: none; color: var(--dim); font-size: 1.2rem; width: 20px; }
  .code-explanation {
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 16px;
    font-style: italic;
  }
  .check-btn {
    font-family: 'Orbitron', monospace;
    font-size: 0.8rem;
    letter-spacing: 2px;
    padding: 12px 28px;
    background: transparent;
    border: 2px solid var(--green);
    color: var(--green);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .check-btn:hover { background: rgba(92,184,92,0.1); box-shadow: 0 0 15px rgba(92,184,92,0.2); }
  .check-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .code-feedback {
    margin-top: 14px;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 0.88rem;
    font-weight: 700;
    display: none;
  }
  .code-feedback.success { background: rgba(92,184,92,0.15); border: 1px solid var(--green); color: var(--green); display: block; }
  .code-feedback.error { background: rgba(224,48,48,0.1); border: 1px solid var(--red); color: var(--red); display: block; }

  /* ===== UNLOCK / TRANSITION ===== */
  .unlock-screen {
    text-align: center;
    padding: 50px 20px;
    display: none;
  }
  .unlock-screen.visible { display: block; }
  .unlock-icon { font-size: 5rem; animation: celebrate 0.5s ease-out; }
  @keyframes celebrate { 0%{transform:scale(0) rotate(-20deg)} 80%{transform:scale(1.1)} 100%{transform:scale(1)} }
  .unlock-title {
    font-family: 'Orbitron', monospace;
    font-size: 1.5rem;
    color: var(--green);
    margin: 20px 0 10px;
    text-shadow: 0 0 20px rgba(92,184,92,0.5);
  }
  .unlock-text { color: #a09060; font-size: 0.95rem; margin-bottom: 25px; line-height: 1.6; }
  .next-btn {
    font-family: 'Orbitron', monospace;
    font-size: 0.8rem;
    letter-spacing: 2px;
    padding: 14px 35px;
    background: var(--amber);
    border: none;
    color: var(--dark);
    border-radius: 6px;
    cursor: pointer;
    font-weight: 700;
    transition: all 0.2s;
  }
  .next-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(240,165,0,0.4); }

  /* ===== FINAL SCREEN ===== */
  .final-screen { text-align: center; padding: 40px 20px; display: none; }
  .final-screen.visible { display: block; }
  .final-icon { font-size: 6rem; }
  .final-title {
    font-family: 'Orbitron', monospace;
    font-size: 1.8rem;
    color: var(--sand);
    margin: 20px 0 10px;
    text-shadow: 0 0 30px rgba(232,200,122,0.6);
  }
  .final-text { color: #a09060; margin-bottom: 25px; line-height: 1.7; font-size: 0.95rem; }
  .certificate {
    background: linear-gradient(135deg, #1e1810, #0f0c07);
    border: 3px solid var(--sand);
    border-radius: 12px;
    padding: 30px;
    display: inline-block;
    margin-bottom: 20px;
    box-shadow: 0 0 40px rgba(232,200,122,0.2);
  }
  .cert-title { font-family: 'Orbitron', monospace; color: var(--sand); font-size: 0.8rem; letter-spacing: 3px; margin-bottom: 8px; }
  .cert-name { font-size: 1.3rem; font-weight: 800; color: #fff; margin-bottom: 5px; }
  .cert-text { font-size: 0.85rem; color: #a09060; }

  /* ===== MISC ===== */
  .info-box {
    background: rgba(126,207,234,0.07);
    border-left: 3px solid var(--sky);
    padding: 10px 14px;
    border-radius: 0 6px 6px 0;
    margin: 12px 0;
    font-size: 0.85rem;
    color: #a0c8d8;
    line-height: 1.6;
  }
  .info-box strong { color: var(--sky); }

  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 1px;
    font-family: 'Share Tech Mono', monospace;
  }
  .badge-a { background: rgba(92,184,92,0.2); color: var(--green); border: 1px solid var(--green); }
  .badge-b { background: rgba(240,165,0,0.2); color: var(--amber); border: 1px solid var(--amber); }
  .badge-c { background: rgba(201,74,44,0.2); color: #e88060; border: 1px solid var(--rust); }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--dim), transparent);
    margin: 20px 0;
  }

  /* ===== RESPONSIVE ===== */
  @media(max-width: 600px) {
    .game-title { font-size: 1.3rem; }
    .bins-row { grid-template-columns: 1fr; }
    .match-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="stars"></div>
<div id="app">

  <!-- HEADER -->
  <div class="game-header">
    <span class="walle-emoji">🤖</span>
    <div class="game-title">WALL-E räumt die Erde auf</div>
    <div class="game-subtitle">KUNSTSTOFF-MISSION // NATURWISSENSCHAFTEN</div>
  </div>

  <!-- NIVEAU SELECTOR -->
  <div class="niveau-bar">
    <div style="font-family:'Share Tech Mono',monospace;font-size:0.8rem;color:#666;padding-top:8px;margin-right:4px;">NIVEAU:</div>
    <button class="niveau-btn active" onclick="setNiveau('A')">🟢 A – Basis</button>
    <button class="niveau-btn" onclick="setNiveau('B')">🟡 B – Standard</button>
    <button class="niveau-btn" onclick="setNiveau('C')">🔴 C – Profi</button>
  </div>

  <!-- PROGRESS -->
  <div class="progress-section">
    <div class="stage-dots">
      <div class="stage-dot active" id="dot1">S1</div>
      <div class="stage-dot" id="dot2">S2</div>
      <div class="stage-dot" id="dot3">S3</div>
    </div>
    <div class="progress-label">Stage <span id="stage-label">1</span>/3 — <span id="stage-name">Sammeln</span></div>
    <div class="score-display">⭐ <span id="score">0</span> Punkte</div>
  </div>

  <!-- MAIN CONTENT -->
  <div id="main-content"></div>

</div>

<script>
// =====================================================================
// STATE
// =====================================================================
let niveau = 'A';
let stage = 1;
let score = 0;
let stage1Code = '';
let stage2Code = '';
let stage3Code = '';

// =====================================================================
// NIVEAU SWITCH
// =====================================================================
function setNiveau(n) {
  niveau = n;
  document.querySelectorAll('.niveau-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  stage = 1;
  score = 0;
  stage1Code = ''; stage2Code = ''; stage3Code = '';
  updateProgress(1, 'Sammeln');
  renderStage1();
}

// =====================================================================
// PROGRESS
// =====================================================================
function updateProgress(s, name) {
  stage = s;  // ← keep global stage in sync
  document.getElementById('stage-label').textContent = s;
  document.getElementById('stage-name').textContent = name;
  document.getElementById('score').textContent = score;
  for(let i=1;i<=3;i++){
    const d = document.getElementById('dot'+i);
    d.className = 'stage-dot';
    if(i < s) d.classList.add('done');
    else if(i === s) d.classList.add('active');
  }
}

// =====================================================================
// CODE DISPLAY
// =====================================================================
function renderCodeBox(containerId, codeDigits, explanation, onCheck) {
  const el = document.getElementById(containerId);
  const filled = codeDigits.filter(d => d !== '?').length;
  const allFilled = codeDigits.every(d => d !== '?');
  
  let digitsHtml = '';
  codeDigits.forEach((d,i) => {
    if(d === '-') { digitsHtml += `<div class="code-digit separator">–</div>`; return; }
    digitsHtml += `<div class="code-digit ${d!=='?'?'filled':''}">${d==='?'?'_':d}</div>`;
  });

  el.innerHTML = `
    <div class="code-section">
      <div class="code-header">▶ FREISCHALT-CODE</div>
      <div class="code-display">${digitsHtml}</div>
      <div class="code-explanation">${explanation}</div>
      <button class="check-btn" onclick="${onCheck}()" ${!allFilled?'disabled':''}>
        CODE PRÜFEN
      </button>
      <div id="code-feedback-${containerId}" class="code-feedback"></div>
    </div>`;
}

function showFeedback(containerId, success, msg) {
  const el = document.getElementById('code-feedback-' + containerId);
  el.className = 'code-feedback ' + (success ? 'success' : 'error');
  el.textContent = msg;
}

// =====================================================================
// ███████████  STAGE 1: SAMMELN – Kunststoffe sortieren  █████████████
// =====================================================================
// Code: S1-Code = 4 Ziffern
// A: Vorgefertigte Auswahl-Aufgabe + einfaches Matching
// B: Matching + Eigenschaften-Zuordnung
// C: Vollständige Tabelle + Begründungen + Kurzstruktur

let s1_sortAnswers = {};
let s1_matchSelected = null;
let s1_matchDone = {};
let s1_mcAnswers = {};

function renderStage1() {

// =====================================================================
// TRACKING SYSTEM – records every answer attempt across all stages
// =====================================================================
const tracker = {
  events: [],
  log(category, question, given, correct, points, stageNum) {
    const sn = stageNum !== undefined ? stageNum : stage;
    const isCorrect = String(given) === String(correct);
    // Keep only the last attempt per question
    this.events = this.events.filter(e => e.question !== question);
    this.events.push({ stage: sn, category, question, given: String(given), correct: String(correct), isCorrect, points, ts: Date.now() });
  },
  logSort(chipId, binGiven, binCorrect, stageNum) {
    const sn = stageNum !== undefined ? stageNum : stage;
    const isCorrect = binGiven === binCorrect;
    this.events = this.events.filter(e => e.question !== 'sort-'+chipId);
    this.events.push({ stage: sn, category: 'sort', question: 'sort-'+chipId, given: binGiven, correct: binCorrect, isCorrect, points: isCorrect ? 5 : 0, ts: Date.now() });
  },
  summary() {
    const byStage = [1,2,3].map(s => {
      const evs = this.events.filter(e => Number(e.stage) === s);
      const correct = evs.filter(e => e.isCorrect).length;
      return { s, total: evs.length, correct, wrong: evs.length - correct };
    });
    const wrongItems = this.events.filter(e => !e.isCorrect);
    return { byStage, wrongItems };
  }
};

// ── Sorting logic ──
let draggedChip = null;

function makeChip(chipId, label, inBin) {
  const chip = document.createElement('div');
  chip.className = 'sort-chip';
  if(inBin) chip.style.fontSize = '0.78rem';
  chip.draggable = true;
  chip.dataset.chip = chipId;
  chip.textContent = label;
  // dragstart: store chipId in closure AND global
  chip.addEventListener('dragstart', (ev) => {
    draggedChip = chipId;
    ev.dataTransfer.setData('text/plain', chipId);
    chip.classList.add('dragging');
  });
  chip.addEventListener('dragend', () => chip.classList.remove('dragging'));
  // click in bin → return to pool
  if(inBin) {
    chip.title = 'Klicken zum Zurücklegen';
    chip.addEventListener('click', () => {
      delete s1_sortAnswers[chipId];
      chip.remove();
      const pool = document.getElementById('sort-pool');
      if(pool) pool.appendChild(makeChip(chipId, label, false));
      updateS1Code();
    });
  }
  return chip;
}

function chipDrag(e, id) {
  draggedChip = id;
  e.dataTransfer && e.dataTransfer.setData('text/plain', id);
}

function chipDrop(e, binName) {
  e.preventDefault();
  const bin = document.getElementById('bin-' + binName);
  bin.classList.remove('drag-over');
  // prefer dataTransfer, fallback to global
  const chipId = (e.dataTransfer && e.dataTransfer.getData('text/plain')) || draggedChip;
  if(!chipId) return;

  // find original chip label (with emoji for Niveau A)
  const existingEl = document.querySelector(`[data-chip="${chipId}"]`);
  const label = existingEl ? existingEl.textContent : chipId;

  // remove from wherever it currently is
  if(existingEl) {
    delete s1_sortAnswers[chipId];
    existingEl.remove();
  }

  s1_sortAnswers[chipId] = binName;
  bin.appendChild(makeChip(chipId, label, true));
  draggedChip = null;
  updateS1Code();
}

// Pool chips also draggable via ondragover on pool (allow re-drop back)
function poolDragOver(e) { e.preventDefault(); }
function poolDrop(e) {
  e.preventDefault();
  const chipId = (e.dataTransfer && e.dataTransfer.getData('text/plain')) || draggedChip;
  if(!chipId) return;
  const existingEl = document.querySelector(`[data-chip="${chipId}"]`);
  const label = existingEl ? existingEl.textContent : chipId;
  if(existingEl) {
    // only move if it's currently in a bin (not already in pool)
    const inPool = existingEl.closest('#sort-pool');
    if(inPool) return;
    delete s1_sortAnswers[chipId];
    existingEl.remove();
  }
  const pool = document.getElementById('sort-pool');
  if(pool) pool.appendChild(makeChip(chipId, label, false));
  draggedChip = null;
  updateS1Code();
}

const sortCorrect = {
  PET:'thermo', PS:'thermo', PVC:'thermo', PP:'thermo',
  HDPE:'thermo', LDPE:'thermo',
  PF:'duro', PA:'thermo',
  PU:'elasto'
};

function checkS1Sort() {
  let correct = 0;
  let total = Object.keys(sortCorrect).length;
  for(let k in sortCorrect) {
    if(s1_sortAnswers[k] === sortCorrect[k]) correct++;
    tracker.logSort(k, s1_sortAnswers[k] || 'nicht sortiert', sortCorrect[k], 1);
  }
  const fb = document.getElementById('sort-feedback');
  if(correct === total) {
    fb.className = 'code-feedback success';
    fb.textContent = `✓ Perfekt! Alle ${total} Kunststoffe richtig sortiert! +${total*5} Punkte`;
    score += total * 5;
    document.getElementById('score').textContent = score;
  } else {
    fb.className = 'code-feedback error';
    fb.textContent = `${correct}/${total} richtig. Überprüfe nochmal: Duroplaste = sehr engmaschig vernetzt, Elastomere = dehnbar.`;
  }
  updateS1Code();
}

// MC logic
function selectMC(id, idx, correct) {
  const container = event.target.closest('.options-list');
  const items = container.querySelectorAll('.option-item');
  items.forEach((it,i) => {
    it.classList.remove('selected','correct','wrong');
    if(i === idx) {
      it.classList.add('selected');
      s1_mcAnswers[id] = idx;
    }
  });
  tracker.log('mc', 'S1-MC-'+id, idx, correct, idx===correct?10:0, 1);
  const fbId = 'mc' + id + '-feedback';
  const fb = document.getElementById(fbId);
  if(idx === correct) {
    items[idx].classList.add('correct');
    fb.className = 'code-feedback success';
    if(id === '12') fb.textContent = '✓ Richtig! Thermoplaste werden beim Erwärmen weich – ideal für den 3D-Druck!';
    else fb.textContent = '✓ Richtig! Autoreifen sind aus Elastomer – sie sind dehnbar und kehren in die Ursprungsform zurück.';
    score += 10;
    document.getElementById('score').textContent = score;
  } else {
    items[idx].classList.add('wrong');
    items[correct].classList.add('correct');
    fb.className = 'code-feedback error';
    if(id === '12') fb.textContent = '✗ Leider falsch. Lies nochmal auf S. 350–351 nach.';
    else fb.textContent = '✗ Leider falsch. Autoreifen sind dehnbar und elastisch – das ist ein Merkmal von Elastomeren (S. 352).';
  }
  updateS1Code();
}

let matchFirst = null;
const matchPairs = {pet:'pet_r', ps:'ps_r', pvc:'pvc_r', hdpe:'hdpe_r', pp:'pp_r'};

function matchClick(id, side) {
  if(s1_matchDone[id]) return;
  if(!matchFirst) {
    matchFirst = {id, side};
    document.getElementById('m-' + id).classList.add('selected');
  } else {
    const a = matchFirst;
    const b = {id, side};
    if(a.side === b.side) {
      document.getElementById('m-' + a.id).classList.remove('selected');
      matchFirst = {id, side};
      document.getElementById('m-' + id).classList.add('selected');
      return;
    }
    // Check match
    const leftId = a.side === 'left' ? a.id : b.id;
    const rightId = a.side === 'right' ? a.id : b.id;
    const correct = matchPairs[leftId] === rightId;
    const aEl = document.getElementById('m-' + a.id);
    const bEl = document.getElementById('m-' + b.id);
    if(correct) {
      aEl.classList.add('matched-correct'); aEl.classList.remove('selected');
      bEl.classList.add('matched-correct');
      s1_matchDone[a.id] = true; s1_matchDone[b.id] = true;
      score += 8;
      document.getElementById('score').textContent = score;
      const fb = document.getElementById('match-feedback');
      fb.className = 'code-feedback success';
      fb.textContent = `✓ Richtig! ${Object.keys(s1_matchDone).length/2}/5 Paare gefunden.`;
    } else {
      aEl.classList.add('matched-wrong'); bEl.classList.add('matched-wrong');
      setTimeout(() => {
        aEl.classList.remove('matched-wrong','selected');
        bEl.classList.remove('matched-wrong');
        const fb = document.getElementById('match-feedback');
        fb.className = 'code-feedback error';
        fb.textContent = `✗ Passt leider nicht. Schau ins Kreisdiagramm auf Seite 349.`;
      }, 700);
    }
    matchFirst = null;
    updateS1Code();
  }
}

// ── Code computation for Stage 1 ──
function computeS1Code() {
  // Code = 4-stellig
  // Ziffer 1: Anzahl Thermoplaste richtig sortiert (max 7 → Zahl 0–7)
  // Ziffer 2: Multiple-Choice korrekt? 1 oder 0
  // Ziffer 3: Matching / C-Task: Anzahl korrekte Paare
  // Ziffer 4: Extra (immer 5)

  let d1, d2, d3, d4;

  // D1: Anzahl Thermoplaste richtig einsortiert
  const thermoCorrect = ['PET','PS','PVC','PP','HDPE','LDPE','PA'];
  let thermoCount = 0;
  thermoCorrect.forEach(k => { if(s1_sortAnswers[k] === 'thermo') thermoCount++; });
  // Map 7→7, 6→6, etc. Capped
  d1 = thermoCount; // 0-7

  // D2: MC12
  d2 = (s1_mcAnswers['12'] === 1) ? 1 : 0;

  // D3: 
  if(niveau === 'A') {
    d3 = (s1_mcAnswers['13'] === 2) ? 2 : 0;
  } else if(niveau === 'B') {
    const pairs = Object.keys(s1_matchDone).filter(k => !k.includes('_r')).length;
    d3 = pairs; // 0-5
  } else {
    d3 = cSelDone['done'] ? 4 : 0;
  }

  d4 = 5; // Immer 5, "Konstante"

  return [d1, d2, d3, d4];
}

function computeS1CorrectCode() {
  if(niveau === 'A') return [7,1,2,5];
  if(niveau === 'B') return [7,1,5,5]; // d1=7 Thermos, d2=1, d3=5 pairs, d4=5
  return [7,1,4,5];
}

function updateS1Code() {
  const digits = computeS1Code();
  const correct = computeS1CorrectCode();
  const display = digits.map((d,i) => d === correct[i] ? String(d) : '?');
  const area = document.getElementById('s1-code-area');
  if(!area) return;
  const allDone = display.every(d => d !== '?');
  area.innerHTML = `
    <div class="code-section">
      <div class="code-header">▶ STAGE-1-CODE // FREISCHALTUNG</div>
      <div class="code-display">
        ${display.map(d => `<div class="code-digit ${d!=='?'?'filled':''}">${d==='?'?'_':d}</div>`).join('')}
      </div>
      <div class="code-explanation">
        Code-Schema: [Thermoplaste sortiert] [MC1 korrekt] [Matching/Tabelle] [5]<br>
        Jede Aufgabe füllt eine Stelle. Löse alle Aufgaben, um den Code zu vervollständigen!
      </div>
      <button class="check-btn" onclick="checkS1Code()" ${!allDone?'disabled':''}>
        CODE PRÜFEN → STAGE 2 FREISCHALTEN
      </button>
      <div id="s1-code-feedback" class="code-feedback"></div>
    </div>`;
}

function checkS1Code() {
  const digits = computeS1Code();
  const correct = computeS1CorrectCode();
  const ok = digits.every((d,i) => d === correct[i]);
  const fb = document.getElementById('s1-code-feedback');
  if(ok) {
    stage1Code = digits.join('');
    fb.className = 'code-feedback success';
    fb.textContent = `✓ CODE AKZEPTIERT! ${digits.join('-')} // WALL-E hat den Müll sortiert! Stage 2 wird freigeschaltet...`;
    setTimeout(() => showUnlock1(), 1500);
  } else {
    fb.className = 'code-feedback error';
    fb.textContent = `✗ Code noch nicht vollständig. Löse alle Aufgaben korrekt.`;
  }
}

function checkRecycle() {
  const correct = {rec_PE:'ja', rec_PF:'nein', rec_PVC:'ja'};
  let c = 0;
  for(let k in correct) {
    const isOk = s2_answers[k] === correct[k];
    if(isOk) c++;
    tracker.log('recycle', 'S2-Recycling-'+k, s2_answers[k]||'—', correct[k], isOk?5:0, 2);
  }
  const fb = document.getElementById('recycle-fb');
  if(c === 3) {
    fb.className = 'code-feedback success';
    fb.textContent = '✓ Richtig! PE und PVC sind Thermoplaste und können durch Schmelzen recycelt werden. PF (Duroplast) nicht!';
    score += 15; document.getElementById('score').textContent = score;
    s2_answers['recycle_done'] = true;
  } else {
    fb.className = 'code-feedback error';
    fb.textContent = `${c}/3 richtig. Duroplaste können nicht durch Schmelzen recycelt werden – ihr Netz bleibt stabil.`;
  }
  updateS2Code();

function selectS2MC(id, idx, correct, listId, fbId) {
  const container = listId ? document.getElementById(listId) : event.target.closest('.options-list');
  if(!container) return;
  const items = container.querySelectorAll('.option-item');
  items.forEach(it => it.classList.remove('selected','correct','wrong'));
  items[idx].classList.add('selected');
  s2_answers['mc_'+id] = idx;
  const isCorrect = idx === correct;
  tracker.log('mc', 'S2-MC-'+id, idx, correct, isCorrect ? 8 : 0, 2);
  const fb = fbId ? document.getElementById(fbId) : null;
  if(isCorrect) {
    items[idx].classList.add('correct');
    score += 8; document.getElementById('score').textContent = score;
    if(fb) { fb.className='code-feedback success'; fb.textContent='✓ Richtig!'; }
  } else {
    items[idx].classList.add('wrong');
    if(items[correct]) items[correct].classList.add('correct');
    if(fb) { fb.className='code-feedback error'; fb.textContent='✗ Nicht ganz – die richtige Antwort ist grün markiert.'; }
  }
  updateS2Code();
}

function computeS2Code() {
  let d1, d2, d3, d4;
  if(niveau === 'A') {
    d1 = (s2_answers['mc_21a'] === 2) ? 3 : '?';
    d2 = (s2_answers['mc_21b'] === 0) ? 1 : '?';
    d3 = (s2_answers['recycle_done']) ? 7 : '?';
    d4 = 2;
  } else if(niveau === 'B') {
    d1 = b21done ? 4 : '?';
    d2 = (s2_answers['mc_22a'] === 2) ? 9 : '?';
    d3 = (s2_answers['mc_22b'] === 0) ? 6 : '?';
    d4 = 1;
  } else {
    d1 = c21done ? 8 : '?';
    d2 = c22done ? 5 : '?';
    d3 = 2;
    d4 = 3;
  }
  return [d1, d2, d3, d4];
}

function updateS2Code() {
  const digits = computeS2Code();
  const allFilled = digits.every(d => d !== '?');
  const area = document.getElementById('s2-code-area');
  if(!area) return;
  area.innerHTML = `
    <div class="code-section">
      <div class="code-header">▶ STAGE-2-CODE // FREISCHALTUNG</div>
      <div class="code-display">
        ${digits.map(d => `<div class="code-digit ${d!=='?'?'filled':''}">${d==='?'?'_':d}</div>`).join('')}
      </div>
      <div class="code-explanation">Löse alle Aufgaben, um den 4-stelligen Code zu erhalten.</div>
      <button class="check-btn" onclick="checkS2Code()" ${!allFilled?'disabled':''}>CODE PRÜFEN → STAGE 3</button>
      <div id="s2-code-feedback" class="code-feedback"></div>
    </div>`;
}

function checkS2Code() {
  const digits = computeS2Code();
  const ok = digits.every(d => d !== '?');
  if(ok) {
    stage2Code = digits.join('');
    const fb = document.getElementById('s2-code-feedback');
    fb.className = 'code-feedback success';
    fb.textContent = `✓ CODE AKZEPTIERT! ${stage2Code} // Eigenschaften-Analyse abgeschlossen!`;
    setTimeout(() => showUnlock2(), 1500);
  }
}

let draggedChip2 = null;
let s3_sort2 = {};
function chipDrag2(e, id) { draggedChip2 = id; }
function chipDrop2(e, binName) {
  e.preventDefault();
  const bin = document.getElementById('bin2-' + binName);
  bin.classList.remove('drag-over');
  if(!draggedChip2) return;
  const existing = document.querySelector(`[data-chip="${draggedChip2}"]`);
  if(existing) { for(let k in s3_sort2) { if(s3_sort2[k]===draggedChip2) delete s3_sort2[k]; } existing.remove(); }
  s3_sort2[draggedChip2] = binName;
  const chip = document.createElement('div');
  chip.className = 'sort-chip';
  chip.style.fontSize = '0.75rem';
  chip.draggable = true;
  chip.dataset.chip = draggedChip2;
  chip.textContent = draggedChip2;
  chip.addEventListener('click', () => { delete s3_sort2[draggedChip2]; chip.remove(); });
  bin.appendChild(chip);
  draggedChip2 = null;
}

function checkB31() {
  const correct = {PLA:'a', PET2:'d', PBAT:'c', PS2:'d'};
  let c = 0;
  for(let k in correct) {
    const isOk = s3_sort2[k] === correct[k];
    if(isOk) c++;
    tracker.log('sort', 'S3-Biokunststoff-'+k, s3_sort2[k]||'—', correct[k], isOk?5:0, 3);
  }
  const fb = document.getElementById('b31-feedback');
  if(c === 4) {
    fb.className = 'code-feedback success';
    fb.textContent = '✓ Perfekt! PLA = nachwachsend+abbaubar; PET aus Erdöl+nicht abbaubar; PBAT = nicht nachwachsend+abbaubar; PS = nicht nachwachsend+nicht abbaubar.';
    score += 20; document.getElementById('score').textContent = score;
    s3_structDone = true;
  } else {
    fb.className = 'code-feedback error';
    fb.textContent = `${c}/4 richtig. Tipp: Schau in Tabelle M3 S. 348 – "nachwachsend" und "abbaubar" sind zwei unabhängige Eigenschaften!`;
  }
  updateS3Code();
}

function buildMatchingB() {
  return `
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0;">
    <div>
      <div class="match-col-header">KUNSTSTOFFGRUPPE</div>
      <div class="match-item" id="mb-tp" onclick="matchClickB('tp','left')">Thermoplast</div>
      <div class="match-item" id="mb-dp" onclick="matchClickB('dp','left')">Duroplast</div>
      <div class="match-item" id="mb-el" onclick="matchClickB('el','left')">Elastomer</div>
    </div>
    <div>
      <div class="match-col-header">STRUKTURMERKMAL</div>
      <div class="match-item" id="mb-tp_r" onclick="matchClickB('tp_r','right')">Lange, unverzweigte Ketten, Van-der-Waals-Kräfte – beim Erwärmen verformbar</div>
      <div class="match-item" id="mb-dp_r" onclick="matchClickB('dp_r','right')">Engmaschiges 3D-Netz aus Elektronenpaarbindungen – hitzebeständig</div>
      <div class="match-item" id="mb-el_r" onclick="matchClickB('el_r','right')">Wenige Verknüpfungspunkte, dehnbar, kehrt in Ausgangsform zurück</div>
    </div>
  </div>`;
}

const matchBPairs = {tp:'tp_r', dp:'dp_r', el:'el_r'};
let matchBFirst = null;
let matchBDone = {};

function matchClickB(id, side) {
  if(matchBDone[id]) return;
  if(!matchBFirst) {
    matchBFirst = {id, side};
    document.getElementById('mb-'+id).classList.add('selected');
  } else {
    const a = matchBFirst;
    const b = {id, side};
    if(a.side === b.side) {
      document.getElementById('mb-'+a.id).classList.remove('selected');
      matchBFirst = {id, side};
      document.getElementById('mb-'+id).classList.add('selected');
      return;
    }
    const leftId = a.side === 'left' ? a.id : b.id;
    const rightId = a.side === 'right' ? a.id : b.id;
    const correct = matchBPairs[leftId] === rightId;
    const aEl = document.getElementById('mb-'+a.id);
    const bEl = document.getElementById('mb-'+b.id);
    if(correct) {
      aEl.classList.add('matched-correct'); aEl.classList.remove('selected');
      bEl.classList.add('matched-correct');
      matchBDone[a.id] = true; matchBDone[b.id] = true;
      score += 10; document.getElementById('score').textContent = score;
    } else {
      aEl.classList.add('matched-wrong'); bEl.classList.add('matched-wrong');
      setTimeout(() => { aEl.classList.remove('matched-wrong','selected'); bEl.classList.remove('matched-wrong'); }, 700);
    }
    matchBFirst = null;
    updateS3Code();
  }
}

function checkC31() {
  const done = Object.keys(matchBDone).filter(k => !k.includes('_r')).length;
  const fb = document.getElementById('c31-feedback');
  tracker.log('match', 'S3-Strukturzuordnung', String(done)+'/3', '3/3', done===3?15:0, 3);
  if(done === 3) {
    fb.className = 'code-feedback success';
    fb.textContent = '✓ Alle Zuordnungen korrekt! Strukturwissen vollständig.';
    score += 15; document.getElementById('score').textContent = score;
    s3_structDone = true;
  } else {
    fb.className = 'code-feedback error';
    fb.textContent = `${done}/3 korrekt zugeordnet.`;
  }
  updateS3Code();
}

let c32done = false;
function checkC32() {
  const t = document.getElementById('c32text').value.trim();
  const fb = document.getElementById('c32-feedback');
  if(t.length < 50) { fb.className='code-feedback error'; fb.textContent='Bitte vollständiger antworten.'; return; }
  fb.className = 'code-feedback success';
  fb.textContent = '✓ Musterlösung: PLA wird aus nachwachsenden Rohstoffen (Stärke) gewonnen. Bakterien können PLA zu CO₂ und Wasser abbauen. Das reduziert Plastikmüll, weil keine dauerhaften Abfälle entstehen.';
  score += 25; document.getElementById('score').textContent = score;
  tracker.log('text', 'S3-PLA-Erklaerung', 'beantwortet', 'beantwortet', 25, 3);
  c32done = true;
  s3_umweltDone = true;
  updateS3Code();
}

function computeS3Code() {
  let d1, d2, d3, d4;
  if(niveau === 'A') {
    d1 = s3_answers['mc31_done'] ? 6 : '?';
    d2 = s3_umweltDone ? 4 : '?';
    d3 = 9;
    d4 = 1;
  } else if(niveau === 'B') {
    d1 = s3_structDone ? 7 : '?';
    d2 = (s3_answers['mc_32b'] === 0) ? 3 : '?';
    d3 = 5;
    d4 = 2;
  } else {
    d1 = s3_structDone ? 9 : '?';
    d2 = c32done ? 8 : '?';
    d3 = 6;
    d4 = 4;
  }
  return [d1, d2, d3, d4];
}

function updateS3Code() {
  const digits = computeS3Code();
  const allFilled = digits.every(d => d !== '?');
  const area = document.getElementById('s3-code-area');
  if(!area) return;
  area.innerHTML = `
    <div class="code-section">
      <div class="code-header">▶ FINAL-CODE // MISSION ABSCHLIESSEN</div>
      <div class="code-display">
        ${digits.map(d => `<div class="code-digit ${d!=='?'?'filled':''}">${d==='?'?'_':d}</div>`).join('')}
      </div>
      <div class="code-explanation">Löse alle 2 Aufgaben, um den finalen Code zu erhalten.</div>
      <button class="check-btn" onclick="checkS3Code()" ${!allFilled?'disabled':''}>FINALE MISSION ABSCHLIESSEN ✓</button>
      <div id="s3-code-feedback" class="code-feedback"></div>
    </div>`;
}

function checkS3Code() {
  const digits = computeS3Code();
  const ok = digits.every(d => d !== '?');
  if(ok) {
    stage3Code = digits.join('');
    const fb = document.getElementById('s3-code-feedback');
    fb.className = 'code-feedback success';
    fb.textContent = `✓ FINAL-CODE AKZEPTIERT! ${stage3Code} // Mission erfolgreich!`;
    setTimeout(() => showFinal(), 1500);
  }
}
